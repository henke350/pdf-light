[package]
name = "pdf-light"
version = "0.1.0"
edition = "2024"

[dependencies]
hayro = { version = "0.9", features = ["embed-fonts"] }
hayro-interpret = "0.9"
lopdf = "0.47"
# OpenGL (glow) instead of the default wgpu backend: faster start, smaller exe.
# Only the default features the app uses are kept (no wgpu, x11, wayland, web).
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "clipboard",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
tiff = "0.11"
rfd = "0.18"
thiserror = "2"
anyhow = "1"

# Printing goes through Windows' own print dialog and GDI. The `windows` crate
# is Rust bindings to those APIs (no C library); only the parts used are enabled.
# The same version rfd and winit already pull in, so nothing new is downloaded.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Memory",
    "Win32_UI_Controls_Dialogs",
] }
# The main window's handle, which the print dialog needs as its owner.
raw-window-handle = "0.6"

# Builds `assets/pdf-light.ico` into the exe as its icon (see build.rs). It
# runs Windows' resource compiler, which comes with the Visual Studio Build Tools.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
