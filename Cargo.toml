[package]
name = "pdf-light"
version = "0.1.0"
edition = "2024"

[dependencies]
hayro = { version = "0.9", features = ["embed-fonts"] }
hayro-interpret = "0.9"
lopdf = "0.47"
# OpenGL (glow) instead of the default wgpu backend: faster start, smaller exe.
# Only the default features the app uses are kept (no wgpu, x11, wayland, web).
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "clipboard",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
tiff = "0.11"
rfd = "0.18"
thiserror = "2"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
